[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrain-cluster"
version = "0.2.0"
description = "Versioned retrieval-augmented clustering with legacy experiment compatibility"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "optuna>=3.0", "tqdm>=4.65"]

[project.optional-dependencies]
remote = ["openai>=2.53.0"]
retrieval = ["chromadb>=0.5"]
local = ["sentence-transformers>=3.0", "torch", "transformers"]
algorithms = ["hdbscan>=0.8", "chinese-whispers==0.9.0", "networkx"]
umap = ["umap-learn"]
analysis = ["matplotlib", "pandas", "scipy"]
api = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
retrain-cluster = "retrain_cluster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retrain_cluster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# 默认排除 integration：那些用例需要真实本地模型与 torch，CI / 预演机上
# 不该因为"没带 55 GB 权重"而变红。需要时显式 `pytest -m integration`。
addopts = "-q -m 'not integration'"
markers = [
    "integration: 需要真实本地向量模型 / 本地 LLM 与 GPU 的端到端测试（默认跳过，用 -m integration 运行）",
]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
